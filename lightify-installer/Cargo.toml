[package]
name = "lightify-installer"
version = "1.0.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "Lightify's own setup / updater / uninstaller: a themed Slint window over a self-extracting payload. Replaces the Inno Setup wizard."

# Lightify-Setup.exe is the stub: the build script (lightify-shell/scripts/build-installer.ps1)
# appends the compressed payload with lightify-pack. The same stub, without payload,
# is installed as uninstall.exe.
[[bin]]
name = "Lightify-Setup"
path = "src/main.rs"

# Release tooling (run on the dev machine, never shipped).
[[bin]]
name = "lightify-pack"
path = "src/bin/lightify-pack.rs"

[[bin]]
name = "lightify-sign"
path = "src/bin/lightify-sign.rs"

[dependencies]
# Same Slint line and features as lightify-shell, so the installer looks and renders
# exactly like the app (software renderer, no-frame winit window). unstable-fontique-010:
# the Han font fallback fix (main.rs fix_han_fallback).
slint = { version = "1", default-features = false, features = ["compat-1-2", "std", "backend-winit", "renderer-software", "unstable-winit-030", "unstable-fontique-010"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Payload compression. zstd at a high level gets ffmpeg + the app to a sane download
# and decompresses at disk speed. zstdmt = multi-threaded compression in lightify-pack.
zstd = { version = "0.13", features = ["zstdmt"] }
sha2 = "0.10"
# lightify-sign: the release manifest signature (verified by lightify-core/src/update.rs).
ed25519-dalek = "2"
base64 = "0.22"
getrandom = "0.2"
dirs = "5"
# The installer's own translations (LANGUAGE-PLAN.md), the same catalogs Slint bundles.
lightify-i18n = { path = "../lightify-i18n" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1"
lightify-i18n = { path = "../lightify-i18n" }

[profile.release]
# The stub is downloaded with every release and copied as uninstall.exe: keep it lean.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
