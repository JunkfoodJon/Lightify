name: Feature request
description: An idea that would make Lightify better.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Lightify to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter to you?
      description: The situation where you'd use it helps more than a design.
    validations:
      required: false
